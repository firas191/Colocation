# Flatshare backend, development stack (Docker Compose v2).
# Published ports: the proxy (API) and the n8n editor, both on 127.0.0.1 only.
# Every other service is reachable only on the compose network.
#   docker compose up -d                          # CPU
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d   # NVIDIA GPU for Ollama
# Versions are pinned here and recorded in docs/VERSIONS.md.
name: flatshare

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
  DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_app}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in .env}
  GENERIC_TIMEZONE: UTC
  TZ: UTC
  NODE_ENV: production                       # hides stack traces in n8n error answers
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"      # n8n 2.x default, stated explicitly
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set in .env}
  N8N_RUNNERS_TASK_TIMEOUT: "60"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"            # hours; failed executions keep input data for debugging
  N8N_PROXY_HOPS: "1"

services:
  postgres:
    build: ./infra/postgres
    image: flatshare/postgres:18-3.6-pgvector0.8
    container_name: fs-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql          # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker
      - ./:/flatshare:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  db-bootstrap:
    image: flatshare/postgres:18-3.6-pgvector0.8
    pull_policy: never          # built locally by the postgres service; never on a registry (FAILURES F-018)
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["bash", "/flatshare/scripts/db-bootstrap.sh"]
    working_dir: /flatshare
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      FLATSHARE_DB: ${FLATSHARE_DB:-flatshare}
      N8N_DB: ${N8N_DB:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n_app}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_WORKER_DB_PASSWORD: ${N8N_WORKER_DB_PASSWORD:?set in .env}
      API_USER_DB_PASSWORD: ${API_USER_DB_PASSWORD:?set in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      S3_HEALTH_URL: http://garage:3903/health
      SECRETS_DIR: /secrets
    volumes:
      - ./:/flatshare:ro
      - ./secrets:/secrets
    restart: "no"

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: fs-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set in .env}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?set in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-flatshare-media}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.4
    container_name: fs-ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBED_MODEL:-bge-m3}"]
    restart: "no"

  # Text Embeddings Inference, CPU build: multilingual-e5-large (the comparison
  # embedding model, spec 10.4) and its tokenizer for chunking (D-034, D-035).
  # The model (about 2.2 GB) is downloaded from Hugging Face on first start.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    container_name: fs-tei
    command: ["--model-id", "intfloat/multilingual-e5-large",
              "--revision", "3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3",
              "--max-client-batch-size", "64", "--auto-truncate", "--port", "80"]
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - tei_data:/data
    # No container health check: the image is not known to ship curl or wget.
    # verify.ps1 and scripts/kb_run.py wait for GET /health from the tests container.
    restart: unless-stopped

  n8n-setup:
    image: n8nio/n8n:2.41.3
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    entrypoint: ["/bin/sh", "/flatshare/scripts/n8n-setup.sh"]
    environment:
      <<: *n8n-env
      N8N_WORKER_DB_PASSWORD: ${N8N_WORKER_DB_PASSWORD}
      APP_DB_HOST: postgres
      FLATSHARE_DB: ${FLATSHARE_DB:-flatshare}
      N8N_IMPORT_TEST_WORKFLOWS: ${N8N_IMPORT_TEST_WORKFLOWS:-0}
    volumes:
      - ./:/flatshare:ro
      - n8n_data:/home/node/.n8n
    restart: "no"

  n8n:
    image: n8nio/n8n:2.41.3
    container_name: fs-n8n
    depends_on:
      n8n-setup: { condition: service_completed_successfully }
    environment:
      <<: *n8n-env
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_SECURE_COOKIE: "false"             # editor served over http on localhost only
    ports:
      - "127.0.0.1:5678:5678"                # editor, loopback only (docs/DECISIONS.md D-020)
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
    restart: unless-stopped

  n8n-runners:
    image: n8nio/runners:2.41.3
    depends_on:
      n8n: { condition: service_started }
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    restart: unless-stopped

  proxy:
    image: caddy:2.11.4-alpine
    container_name: fs-proxy
    depends_on:
      n8n: { condition: service_healthy }
    environment:
      N8N_UPSTREAM: n8n:5678
      PROXY_PORT: "8080"
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  # Queue mode (main + workers) is for the load tests of phase 9. Nothing on the
  # request path uses Redis in this phase (docs/DECISIONS.md D-016, D-017).
  redis:
    image: redis:8.10.2-alpine
    profiles: ["queue"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}", "--save", ""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    restart: unless-stopped

  # Static files for the ingestion tests (profile "test"): robots.txt, HTML and
  # PDF fixtures served on the compose network only (not published).
  fixtures:
    image: caddy:2.11.4-alpine
    container_name: fs-fixtures
    profiles: ["test"]
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8081"]
    volumes:
      - ./tests/fixtures/kb:/srv:ro
    restart: "no"

  # Test runner (profile "test"). It mounts the Docker socket only so that the
  # outage tests can stop and start containers; do not enable it elsewhere.
  tests:
    build: ./infra/tests
    image: flatshare/tests:py3.12.14
    profiles: ["test"]
    environment:
      FS_API_BASE: http://proxy:8080
      FS_VIA_PROXY: "1"
      FS_SECRETS_FILE: /flatshare/secrets/api-clients.env
      FS_TEST_DB_DSN: host=postgres dbname=${FLATSHARE_DB:-flatshare} user=n8n_worker password=${N8N_WORKER_DB_PASSWORD}
      FS_OUTAGE_DATABASE_STOP: docker stop fs-postgres
      FS_OUTAGE_DATABASE_START: docker start fs-postgres
      FS_OUTAGE_APPDB_STOP: docker exec -u postgres fs-postgres psql -qAt -c "alter role n8n_worker nologin" -c "select count(pg_terminate_backend(pid)) from pg_stat_activity where usename = 'n8n_worker'"
      FS_OUTAGE_APPDB_START: docker exec -u postgres fs-postgres psql -qAt -c "alter role n8n_worker login"
      FS_OUTAGE_OLLAMA_STOP: docker stop fs-ollama
      FS_OUTAGE_OLLAMA_START: docker start fs-ollama
      FS_OUTAGE_STORAGE_STOP: docker stop fs-garage
      FS_OUTAGE_STORAGE_START: docker start fs-garage
      FS_FIXTURES_BASE: http://fixtures:8081
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"          # progress lines appear while a long job runs (F-028)
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - ./:/flatshare:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /flatshare

volumes:
  tei_data:
  pgdata:
  garage_meta:
  garage_data:
  ollama_models:
  n8n_data:
