          type: object
          required: [id, profile_version, jurisdiction_code, anchor]
          properties:
            id: { type: string, format: uuid }
            profile_version: { type: integer }
            jurisdiction_code: { type: [string, "null"] }
            anchor: { oneOf: [{ $ref: "#/components/schemas/LatLng" }, { type: "null" }] }
            anchor_geocode: { type: [object, "null"] }
    ProfileExtractRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        jurisdiction: { type: string, description: "Default: the account's jurisdiction" }
        save: { type: boolean, default: false }
    ProfileExtractResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [profile, search_jurisdiction, anchor, warnings, saved]
          properties:
            profile: { type: object, description: "P2 output after the deterministic checks (prompts/schemas/P2_profile_extractor.schema.json)" }
            search_jurisdiction: { type: [string, "null"] }
            anchor: { type: [object, "null"], description: "{status: found | ambiguous | not_found, place, candidates}" }
            warnings: { type: array, items: { type: string } }
            saved: { type: [object, "null"] }
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        jurisdiction: { type: string }
    AssistantResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [intent, status]
          properties:
            intent: { type: [string, "null"], enum: [search_listings, post_listing, legal_question, generate_document, report_problem, smalltalk_or_unsupported, null] }
            status:
              type: string
              enum: [results, answered, abstained, proposed, profile_failed, search_failed, clarification_needed, not_available_yet, unsupported, not_understood]
              description: "legal_question (A5 Legal agent, D-087): answered, or abstained when the excerpts retrieved do not support an answer. post_listing (owner assistant, D-088): proposed (see proposal) or answered."
            answer:
              type: [string, "null"]
              description: >-
                The Match agent's answer (D-084); null when it was dropped because it had a number no tool gave (warning
                agent_answer_unsupported). Absent on the fixed path. For a legal question, the Legal agent's answer with
                [n] markers that refer to `citations`; null when it abstained.
            abstained: { type: boolean, description: "Legal question: the Legal agent did not answer (spec 10.6)." }
            abstain_reason:
              type: [string, "null"]
              enum: [not_found, no_search, no_citation, unsupported_numbers, null]
              description: "not_found: the model said the excerpts do not answer; no_search: it answered without searching; no_citation: no marker referred to an excerpt it retrieved; unsupported_numbers: a number no excerpt or message gives."
            conflict: { type: boolean, description: "Legal question: the sources cited disagree; the answer gives each position." }
            citations:
              type: array
              items:
                type: object
                required: [n, title, source_type]
                properties:
                  n: { type: integer, minimum: 1 }
                  title: { type: [string, "null"] }
                  cite_as: { type: [string, "null"] }
                  url: { type: [string, "null"] }
                  source_type: { type: [string, "null"], enum: [primary_law, regulator, government_guide, ngo, commercial_guide, blog, internal, null] }
                  reliability: { type: [integer, "null"], minimum: 1, maximum: 5 }
                  article: { type: [string, "null"] }
                  retrieved_at: { type: [string, "null"] }
                  chunk_id: { type: [string, "null"], format: uuid }
            missing_information: { type: [string, "null"], description: "Legal question, not_found: what the model said is missing." }
            notice_version: { type: [string, "null"], description: "Version of the notice the channel shows with a legal answer (setting legal.notice_version)." }
            jurisdiction: { type: [string, "null"], description: "Legal question: the country whose sources were searched (plus global sources). Search answered by the Match agent: the country searched (D-120)." }
            proposal:
              type: [object, "null"]
              description: >-
                Owner assistant (status proposed, D-088): a change of one of the user's listings, not applied. Apply it
                with PATCH /v1/listings/{listing_id} and body {"change_id": ...} before expires_at.
              properties:
                change_id: { type: string, format: uuid }
                listing_id: { type: string, format: uuid }
                listing_number: { type: [integer, "null"] }
                diff: { type: array, items: { $ref: "#/components/schemas/ListingChange" } }
                changes: { type: object }
                expires_at: { type: string }
            agent:
              type: object
              description: Tools the Match or Legal agent called for this message and how many stored messages it had.
              properties:
                tool_calls: { type: array, items: { type: string } }
                memory_messages: { type: integer }
            language: { type: [string, "null"] }
            confidence: { type: [number, "null"] }
            clarifying_question: { type: [string, "null"] }
            profile: { type: [object, "null"] }
            anchor: { type: [object, "null"] }
            results: { type: array, items: { $ref: "#/components/schemas/ListingResult" } }
            count: { type: integer }
            applied: { type: [object, "null"] }
            warnings: { type: array, items: { type: string } }
            data_attribution: { type: array, items: { type: string } }
    MeResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [user_id, role, locale, consents, consent_required, flags, counts, badges, jurisdictions]
          properties:
            user_id: { type: string, format: uuid }
            email: { type: [string, "null"] }
