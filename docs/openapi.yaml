openapi: 3.1.0
info:
  title: Flatshare backend API
  version: "1.1.0-phase2"
  description: |
    Contract for the website server (and test clients). Browsers never call this API
    directly: the website server signs every request (docs/API_SIGNING.md).
    This file grows phase by phase; it lists only endpoints that exist and pass their
    contract tests. Phase 1: /v1/health, /v1/users/sync. Phase 2: /v1/jobs/{id} and the admin
    endpoints for knowledge-base ingestion and retrieval evaluation.
    Errors, job states and verdicts are returned as codes, never as sentences to show.
servers:
  - url: http://localhost:8080
    description: Development proxy (docker compose)
security:
  - signedRequest: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Dependency check (database, object storage, Ollama and the embedding model)
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdOptional"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: All dependencies answered correctly
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: |
            A dependency is down (body is a HealthResponse with status "degraded"), or the
            gateway could not reach the database (body is an ErrorEnvelope, code UPSTREAM_UNAVAILABLE).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthResponse"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/users/sync:
    post:
      operationId: syncUser
      summary: Create or update the platform user after the website's login
      description: |
        Called by the website server after authentication. Creates the app.users row on
        first call (201) and updates the given fields afterwards (200). Omitted fields keep
        their stored value. Returns the platform user id and consent status.
        Idempotent per X-Idempotency-Key: a repeated request with the same key and body
        returns the stored response unchanged (including its original request_id).
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XIdempotencyKey"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSyncRequest" }
      responses:
        "201":
          description: User created
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSyncResponse" }
        "200":
          description: Existing user updated
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSyncResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/admin/kb/ingest:
    post:
      operationId: ingestKnowledgeBase
      summary: Fetch, clean, chunk and embed the sources of a jurisdiction pack (role admin, asynchronous)
      description: |
        Creates a job of type kb_ingest and returns 202. The worker (wf.kb.ingest) checks robots.txt,
        fetches each active source of the jurisdiction (and the global sources unless include_global is
        false), stores the raw bytes and the cleaned text as a new document version when the text changed,
        chunks it with both strategies and embeds every chunk with every active embedding model. Unchanged
        sources are skipped unless force is true. The job fails if any source fails; its output lists the
        outcome per source.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbIngestRequest" }
      responses:
        "202":
          description: Job created (or the existing job of a retried request)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/admin/eval/runs:
    post:
      operationId: createEvalRuns
      summary: Run a retrieval evaluation over a matrix of configurations (role admin, asynchronous)
      description: |
        Creates a job of type eval_retrieval. The worker (wf.eval.retrieval) resolves the dataset's gold
        spans against the current documents (the job fails if any span cannot be found), embeds the queries
        once per model, and stores one eval.runs row per configuration with per-query results and metrics.
        Without configs, the full matrix (2 strategies x 2 models x dense, lexical, hybrid) is run.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalRunRequest" }
      responses:
        "202":
          description: Job created (or the existing job of a retried request)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/admin/eval/runs/{id}:
    get:
      operationId: getEvalRun
      summary: One evaluation run with its configuration, summary and per-query metrics (role admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The run
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRunResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Status and result of an asynchronous job
      description: |
        Visible to the user who requested the job and to admins and moderators. Any other caller, a
        malformed id or an unknown id get 404 (the existence of other users' jobs is not revealed).
        Poll every 2 to 10 seconds until status is succeeded, failed or cancelled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The job
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/search:
    get:
      operationId: search
      summary: Structured search over published listings (filters plus optional text)
      description: |
        Hybrid search (dense bge-m3 + lexical, fused by reciprocal rank) when q is given, filters only
        otherwise (nearest first with a point, newest first without). Results carry public fields only:
        the fuzzed public_location, never the exact address. Money is in minor units of the currency
        (exponent given with each rent). A budget in another currency than the jurisdiction's is
        converted with the latest exchange rate not older than fx.max_age_days; without one the budget
        is not applied and warnings holds fx_rate_unavailable. Warnings are codes: fx_rate_unavailable,
        place_not_found, place_ambiguous, embedding_unavailable. Requires terms and privacy consent.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - { name: q, in: query, schema: { type: string, maxLength: 300 }, description: "Free text in any language" }
        - { name: jurisdiction, in: query, schema: { type: string }, description: "Default: the account's jurisdiction" }
        - { name: max_rent, in: query, schema: { type: string, pattern: "^[0-9]+$" }, description: "Monthly (or weekly, see period) budget in minor units of currency" }
        - { name: currency, in: query, schema: { type: string, pattern: "^[A-Z]{3}$" }, description: "Default: the jurisdiction's currency" }
        - { name: period, in: query, schema: { type: string, enum: [month, week] } }
        - { name: lat, in: query, schema: { type: string } }
        - { name: lng, in: query, schema: { type: string } }
        - { name: near, in: query, schema: { type: string, maxLength: 120 }, description: "Place name resolved by the local gazetteer (app.geocode)" }
        - { name: radius_m, in: query, schema: { type: string }, description: "100 to 100000; default search.default_radius_m around a point or place" }
        - { name: limit, in: query, schema: { type: string }, description: "1 to 50, default 20" }
        - { name: use_profile, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Fill missing filters from the saved profile" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/profiles/extract:
    post:
      operationId: extractProfile
      summary: Turn a free-text request into a structured search profile (prompt P2, local model)
      description: |
        The text is processed by the local language model and is not stored. Preferences that the
        jurisdiction does not allow are moved to unparsed (warning preference_not_allowed). The anchor is
        resolved with the local gazetteer. With save=true the profile is stored as PUT /v1/profiles/me
        would. Errors: EXTRACTION_FAILED (the model answer was invalid twice), UPSTREAM_UNAVAILABLE.
        Warnings: preference_not_allowed, currency_assumed, currency_unknown, budget_range_reversed,
        anchor_not_found, anchor_ambiguous. Requires terms and privacy consent.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileExtractRequest" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileExtractResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/profiles/me:
    put:
      operationId: putProfile
      summary: Save or correct the caller's search profile (the whole profile is replaced)
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/assistant/message:
    post:
      operationId: assistantMessage
      summary: Free-form message; the orchestrator classifies it (prompt P1) and routes it
      description: |
        Phase 3 serves search_listings (profile extraction, then search). Other intents answer with a
        status code: clarification_needed (with the router's question, in the user's language),
        not_available_yet (legal_question, post_listing, generate_document, report_problem until their
        agents exist), unsupported, not_understood. Requires terms and privacy consent.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantMessageRequest" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/admin/eval/prompt-runs:
    post:
      operationId: createPromptEvalRuns
      summary: Run a prompt's golden set for given versions and models (role admin, asynchronous)
      description: |
        Creates a job of type eval_prompts (worker wf.eval.prompts): one eval.runs row per model and version, per-item results, a summary, and one ai.prompt_failures row per failed item and category (spec 9.5).
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptEvalRunRequest" }
      responses:
        "202":
          description: Job created (or the existing job of a retried request)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/admin/listings/embed:
    post:
      operationId: embedListings
      summary: Embed every listing that has no embedding (role admin, asynchronous)
      description: |
        Creates a job of type listings_embed (worker wf.listings.embed, bge-m3 through Ollama, 16 texts per request, one request at a time).
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyRequest" }
      responses:
        "202":
          description: Job created (or the existing job of a retried request)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/admin/fx/refresh:
    post:
      operationId: refreshFxRates
      summary: Fetch the ECB euro reference rates now (role admin, asynchronous)
      description: |
        Creates a job of type fx_refresh (worker wf.fx.refresh, also scheduled on weekdays at 17:10). Rates are stored in app.fx_rates with the ECB cited as source.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyRequest" }
      responses:
        "202":
          description: Job created (or the existing job of a retried request)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256 over the canonical request, keyed with the client secret issued by
        scripts/db-bootstrap.sh. See docs/API_SIGNING.md for the canonical string.
  parameters:
    XKeyId:
      name: X-Key-Id
      in: header
      required: true
      description: Id of the calling server's key (for example "website").
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{2,39}$" }
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix time in seconds. Accepted when within 300 s of the server clock.
      schema: { type: string, pattern: "^[0-9]{1,12}$" }
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Caller-generated UUID. Each value is accepted once (replay protection).
      schema: { type: string, format: uuid }
    XSignature:
      name: X-Signature
      in: header
      required: true
      description: Lowercase hex HMAC-SHA256 (64 characters).
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    XUserIdRequired:
      name: X-User-Id
      in: header
      required: true
      description: Platform user id (from /v1/users/sync), signed; the route needs a user with the right role
      schema: { type: string, format: uuid }
    XUserIdOptional:
      name: X-User-Id
      in: header
      required: false
      description: Platform user id the request is made for. Signed; trusted only when the signature is valid.
      schema: { type: string, format: uuid }
    XIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Required on state-changing calls. Same key and same request returns the stored response.
      schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{8,128}$" }
    XClientIp:
      name: X-Client-Ip
      in: header
      required: false
      description: End user's IP as seen by the website server. Signed; used for per-IP rate limits.
      schema: { type: string, maxLength: 45 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string }
  headers:
    XRequestId:
      description: The request id this answer belongs to.
      schema: { type: string, format: uuid }
  responses:
    Unauthenticated:
      description: Missing, invalid, stale or replayed signature, or unknown user (code UNAUTHENTICATED)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Erased account or insufficient role (code FORBIDDEN), or missing consent (code CONSENT_REQUIRED)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Unknown route or resource, or a resource the caller may not see (code NOT_FOUND)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: Idempotency key reused for another request or still in progress, or email linked to another account (code CONFLICT)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    PayloadTooLarge:
      description: Body larger than 1 MiB (code PAYLOAD_TOO_LARGE, returned by the proxy)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ValidationFailed:
      description: Invalid body, header or query (code VALIDATION_FAILED); details list field and issue codes
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: Too many requests (code RATE_LIMITED); Retry-After header and details[0].retry_after_s
      headers:
        Retry-After: { schema: { type: string } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    UpstreamUnavailable:
      description: A backend dependency is unavailable (code UPSTREAM_UNAVAILABLE); safe to retry with the same idempotency key
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    ErrorCode:
      type: string
      enum: [UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED, NOT_FOUND, CONSENT_REQUIRED, RATE_LIMITED,
             CONFLICT, UPSTREAM_UNAVAILABLE, POLICY_BLOCKED, INTERNAL, PAYLOAD_TOO_LARGE, EXTRACTION_FAILED]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id: { type: string, format: uuid }
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "English text for logs and developers. Clients display text from their own catalogue keyed by code." }
            details: { type: array, items: { type: object } }
    Meta:
      type: object
      required: [latency_ms]
      properties:
        latency_ms: { type: integer, minimum: 0 }
    HealthCheck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [status, checks]
          properties:
            status: { type: string, enum: [ok, degraded] }
            checks:
              type: object
              required: [database, object_storage, ollama]
              properties:
                database:
                  allOf:
                    - $ref: "#/components/schemas/HealthCheck"
                    - type: object
                      properties:
                        server_version: { type: string }
                        migration: { type: string }
                        extensions: { type: object, additionalProperties: { type: string } }
                object_storage: { $ref: "#/components/schemas/HealthCheck" }
                ollama:
                  allOf:
                    - $ref: "#/components/schemas/HealthCheck"
                    - type: object
                      properties:
                        reachable: { type: boolean }
                        embed_model: { type: string }
                        embed_model_present: { type: boolean }
    UserSyncRequest:
      type: object
      additionalProperties: false
      required: [external_auth_id]
      properties:
        external_auth_id: { type: string, minLength: 1, maxLength: 255, description: "Subject id from the auth provider (printable ASCII)" }
        email: { type: string, maxLength: 254, format: email }
        display_name: { type: string, maxLength: 100 }
        locale: { type: string, maxLength: 35, description: "BCP-47 tag" }
        jurisdiction_code: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
    Consent:
      type: object
      required: [granted, policy_version, granted_at]
      properties:
        granted: { type: boolean }
        policy_version: { type: string }
        granted_at: { type: string, format: date-time }
    UserSyncResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [user_id, created, role, locale, consents, consent_required]
          properties:
            user_id: { type: string, format: uuid }
            created: { type: boolean }
            role: { type: string, enum: [user, owner, moderator, admin] }
            locale: { type: string }
            jurisdiction_code: { type: [string, "null"] }
            consents:
              type: object
              description: Latest decision per purpose
              additionalProperties: { $ref: "#/components/schemas/Consent" }
            consent_required:
              type: array
              description: Purposes the platform needs before use and that are not granted (terms, privacy)
              items: { type: string, enum: [terms, privacy] }
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    KbIngestRequest:
      type: object
      additionalProperties: false
      required: [jurisdiction]
      properties:
        jurisdiction: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
        include_global: { type: boolean, default: true }
        sources: { type: array, maxItems: 200, items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,79}$" }, description: "Only these source keys (default: all active sources)" }
        force: { type: boolean, default: false, description: "Create a new version and re-chunk even if the text did not change" }
    EvalConfig:
      type: object
      additionalProperties: false
      required: [strategy, model, mode]
      properties:
        strategy: { type: string, enum: [fixed_500_50, structure_aware_v1] }
        model: { type: string, enum: [bge-m3, multilingual-e5-large] }
        mode: { type: string, enum: [dense, lexical, hybrid] }
        candidates: { type: integer, minimum: 1, maximum: 500, default: 50 }
        rrf_k: { type: integer, minimum: 1, maximum: 500, default: 60 }
    EvalRunRequest:
      type: object
      additionalProperties: false
      required: [dataset, jurisdiction]
      properties:
        dataset: { type: string, pattern: "^[a-z0-9_]{3,60}$" }
        version: { type: integer, minimum: 1, default: 1 }
        jurisdiction: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
        k: { type: integer, minimum: 1, maximum: 50, default: 10 }
        configs: { type: array, minItems: 1, maxItems: 48, items: { $ref: "#/components/schemas/EvalConfig" } }
        git_sha: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 80 }
    JobAcceptedResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [job_id, type, status, status_url]
          properties:
            job_id: { type: string, format: uuid }
            type: { type: string, enum: [kb_ingest, eval_retrieval, eval_prompts, listings_embed, fx_refresh] }
            status: { $ref: "#/components/schemas/JobStatus" }
            status_url: { type: string, pattern: "^/v1/jobs/[0-9a-f-]{36}$" }
    JobResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [job_id, type, status, attempts, created_at, started_at, finished_at, output, error]
          properties:
            job_id: { type: string, format: uuid }
            type: { type: string }
            status: { $ref: "#/components/schemas/JobStatus" }
            attempts: { type: integer, minimum: 0 }
            created_at: { type: string, format: date-time }
            started_at: { type: [string, "null"], format: date-time }
            finished_at: { type: [string, "null"], format: date-time }
            output: { type: [object, "null"], description: "Job-type specific result (kb_ingest: counts and per-source outcomes; eval_retrieval: runs and summaries)" }
            error: { type: [string, "null"], description: "Short machine-oriented reason when the job failed" }
    EvalRunResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [run_id, dataset, status, config, summary, queries]
          properties:
            run_id: { type: string, format: uuid }
            dataset: { type: string }
            status: { type: string, enum: [running, succeeded, failed] }
            config: { type: object }
            git_sha: { type: [string, "null"] }
            job_id: { type: [string, "null"], format: uuid }
            started_at: { type: string, format: date-time }
            finished_at: { type: [string, "null"], format: date-time }
            summary: { type: [object, "null"] }
            queries:
              type: array
              items:
                type: object
                required: [query_id, metrics]
                properties:
                  query_id: { type: string }
                  language: { type: [string, "null"] }
                  tags: { type: array, items: { type: string } }
                  metrics: { type: object }
    EmptyRequest:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 5000, description: "listings/embed only" }
    PromptEvalRunRequest:
      type: object
      additionalProperties: false
      required: [prompt, versions]
      properties:
        prompt: { type: string, enum: [P1_router, P2_profile_extractor] }
        versions: { type: array, minItems: 1, maxItems: 5, items: { type: integer, minimum: 1 } }
        models: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: "Default: setting llm.default_model" }
        dataset: { type: string, description: "Default: p1_router or p2_profile" }
        dataset_version: { type: integer, minimum: 1, default: 1 }
        item_ids: { type: array, items: { type: string } }
        limit: { type: integer, minimum: 1, maximum: 1000 }
        git_sha: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 80 }
    Money:
      type: object
      required: [amount_minor, currency, period, monthly_minor, exponent]
      properties:
        amount_minor: { type: [integer, "null"] }
        currency: { type: [string, "null"] }
        period: { type: string, enum: [month, week] }
        monthly_minor: { type: [integer, "null"], description: "weekly x 52 / 12, rounded down" }
        exponent: { type: [integer, "null"], description: "minor units per major unit = 10^exponent" }
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    ListingResult:
      type: object
      required: [id, rank, kind, title, rent, public_location, is_synthetic]
      not: { required: [location] }
      properties:
        id: { type: string, format: uuid }
        rank: { type: integer }
        score: { type: [number, "null"] }
        dense_rank: { type: [integer, "null"] }
        lexical_rank: { type: [integer, "null"] }
        distance_m: { type: [number, "null"], description: "From the search point to the public (fuzzed) point" }
        kind: { type: string, enum: [room, shared_flat, roommate_wanted] }
        title: { type: [string, "null"] }
        description: { type: [string, "null"], description: "First 400 characters" }
        description_lang: { type: [string, "null"] }
        rent: { $ref: "#/components/schemas/Money" }
        deposit_minor: { type: [integer, "null"] }
        bills_included: { type: [boolean, "null"] }
        available_from: { type: [string, "null"], format: date }
        min_stay_months: { type: [integer, "null"] }
        bedrooms: { type: [integer, "null"] }
        furnished: { type: [boolean, "null"] }
        current_flatmates: { type: [integer, "null"] }
        amenities: { type: [array, "null"], items: { type: string } }
        house_rules: { type: [object, "null"] }
        city: { type: [string, "null"] }
        neighbourhood: { type: [string, "null"] }
        public_location: { oneOf: [{ $ref: "#/components/schemas/LatLng" }, { type: "null" }] }
        trust: { type: object }
        is_synthetic: { type: boolean }
    SearchData:
      type: object
      required: [mode, count, results, applied, warnings]
      properties:
        mode: { type: string, enum: [hybrid, filters] }
        count: { type: integer }
        results: { type: array, items: { $ref: "#/components/schemas/ListingResult" } }
        applied: { type: object, description: "Filters as applied: jurisdiction, budget (with fx when converted), center, radius_m, place (geocoding result), limit" }
        warnings: { type: array, items: { type: string, enum: [fx_rate_unavailable, place_not_found, place_ambiguous, embedding_unavailable] } }
        data_attribution: { type: array, items: { type: string, enum: [openstreetmap] }, description: "Sources the client must credit (OpenStreetMap: place coordinates)" }
    SearchResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data: { $ref: "#/components/schemas/SearchData" }
    Preferences:
      type: object
      additionalProperties: false
      properties:
        smoking: { type: string, enum: ["yes", "no"] }
        pets: { type: string, enum: ["yes", "no"] }
        quiet_hours: { type: string, enum: ["yes", "no"] }
        guests: { type: string, enum: ["yes", "no"] }
        schedule: { type: string, enum: [early, late, irregular] }
        cleanliness: { type: string, enum: [high, medium, relaxed] }
    ProfileInput:
      type: object
      additionalProperties: false
      required: [jurisdiction_code]
      properties:
        jurisdiction_code: { type: string }
        budget_min_minor: { type: [integer, "null"], minimum: 0 }
        budget_max_minor: { type: [integer, "null"], minimum: 0 }
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$", description: "Required when a budget is given" }
        budget_period: { type: [string, "null"], enum: [month, week, null] }
        anchor_label: { type: [string, "null"], maxLength: 120 }
        anchor_lat: { type: [number, "null"] }
        anchor_lng: { type: [number, "null"] }
        max_commute_min: { type: [integer, "null"], minimum: 0, maximum: 300 }
        search_radius_m: { type: [integer, "null"], minimum: 100, maximum: 100000 }
        move_in_from: { type: [string, "null"], format: date }
        min_stay_months: { type: [integer, "null"], minimum: 0, maximum: 120 }
        declared_preferences: { $ref: "#/components/schemas/Preferences" }
        languages: { type: array, items: { type: string, enum: [ar, aeb, fr, en, de, es, it] } }
        unparsed: { type: array, items: { type: string } }
    ProfileResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [id, profile_version, jurisdiction_code, anchor]
          properties:
            id: { type: string, format: uuid }
            profile_version: { type: integer }
            jurisdiction_code: { type: [string, "null"] }
            anchor: { oneOf: [{ $ref: "#/components/schemas/LatLng" }, { type: "null" }] }
            anchor_geocode: { type: [object, "null"] }
    ProfileExtractRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        jurisdiction: { type: string, description: "Default: the account's jurisdiction" }
        save: { type: boolean, default: false }
    ProfileExtractResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [profile, search_jurisdiction, anchor, warnings, saved]
          properties:
            profile: { type: object, description: "P2 output after the deterministic checks (prompts/schemas/P2_profile_extractor.schema.json)" }
            search_jurisdiction: { type: [string, "null"] }
            anchor: { type: [object, "null"], description: "{status: found | ambiguous | not_found, place, candidates}" }
            warnings: { type: array, items: { type: string } }
            saved: { type: [object, "null"] }
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        jurisdiction: { type: string }
    AssistantResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [intent, status]
          properties:
            intent: { type: [string, "null"], enum: [search_listings, post_listing, legal_question, generate_document, report_problem, smalltalk_or_unsupported, null] }
            status: { type: string, enum: [results, profile_failed, search_failed, clarification_needed, not_available_yet, unsupported, not_understood] }
            language: { type: [string, "null"] }
            confidence: { type: [number, "null"] }
            clarifying_question: { type: [string, "null"] }
            profile: { type: [object, "null"] }
            anchor: { type: [object, "null"] }
            results: { type: array, items: { $ref: "#/components/schemas/ListingResult" } }
            count: { type: integer }
            applied: { type: [object, "null"] }
            warnings: { type: array, items: { type: string } }
            data_attribution: { type: array, items: { type: string } }
