            schema: { type: object }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatmateAssistantResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/me/flatmate-profile/apply:
    post:
      operationId: applyFlatmateProfile
      summary: Save the answers the person confirmed (platform P12, D-115; terms and privacy consent)
      description: |
        Only the fields given change: lifestyle (the search profile's declared preferences), budget_min and budget_max (in
        the main unit of the country's currency), languages, move_in_from, and the flatmate profile's headline, seeking, areas
        and visible. Answers what is known and what is still missing.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatmateOnboardingStateResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/places:
    get:
      operationId: listPlaces
      summary: Places of a country's gazetteer
      description: |
        The active places of one country (geo/places.csv), cities by default, with the name in the requested language when the
        gazetteer has one. The website's city filter (D-118).
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - { name: jurisdiction, in: query, required: true, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: kind, in: query, schema: { type: string, enum: [city, district, neighbourhood, campus, station, landmark] } }
        - { name: lang, in: query, schema: { type: string, enum: [fr, en, ar] } }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacesResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256 over the canonical request, keyed with the client secret issued by
        scripts/db-bootstrap.sh. See docs/API_SIGNING.md for the canonical string.
  parameters:
    XKeyId:
      name: X-Key-Id
      in: header
      required: true
      description: Id of the calling server's key (for example "website").
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{2,39}$" }
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix time in seconds. Accepted when within 300 s of the server clock.
      schema: { type: string, pattern: "^[0-9]{1,12}$" }
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Caller-generated UUID. Each value is accepted once (replay protection).
      schema: { type: string, format: uuid }
    XSignature:
      name: X-Signature
      in: header
      required: true
      description: Lowercase hex HMAC-SHA256 (64 characters).
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    XUserIdRequired:
      name: X-User-Id
      in: header
      required: true
      description: Platform user id (from /v1/users/sync), signed; the route needs a user with the right role
      schema: { type: string, format: uuid }
    XUserIdOptional:
      name: X-User-Id
      in: header
      required: false
      description: Platform user id the request is made for. Signed; trusted only when the signature is valid.
      schema: { type: string, format: uuid }
    XIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Required on state-changing calls. Same key and same request returns the stored response.
      schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{8,128}$" }
    XClientIp:
      name: X-Client-Ip
      in: header
      required: false
      description: End user's IP as seen by the website server. Signed; used for per-IP rate limits.
      schema: { type: string, maxLength: 45 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string }
  headers:
    XRequestId:
      description: The request id this answer belongs to.
      schema: { type: string, format: uuid }
  responses:
    Unauthenticated:
      description: Missing, invalid, stale or replayed signature, or unknown user (code UNAUTHENTICATED)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Erased account or insufficient role (code FORBIDDEN), or missing consent (code CONSENT_REQUIRED)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Unknown route or resource, or a resource the caller may not see (code NOT_FOUND)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: Idempotency key reused for another request or still in progress, or email linked to another account (code CONFLICT)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    PayloadTooLarge:
      description: Body larger than 1 MiB (code PAYLOAD_TOO_LARGE, returned by the proxy)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ValidationFailed:
      description: Invalid body, header or query (code VALIDATION_FAILED); details list field and issue codes
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: Too many requests (code RATE_LIMITED); Retry-After header and details[0].retry_after_s
      headers:
        Retry-After: { schema: { type: string } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    UpstreamUnavailable:
      description: A backend dependency is unavailable (code UPSTREAM_UNAVAILABLE); safe to retry with the same idempotency key
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    ErrorCode:
      type: string
      enum: [UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED, NOT_FOUND, CONSENT_REQUIRED, RATE_LIMITED,
             CONFLICT, UPSTREAM_UNAVAILABLE, POLICY_BLOCKED, INTERNAL, PAYLOAD_TOO_LARGE, EXTRACTION_FAILED]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id: { type: string, format: uuid }
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "English text for logs and developers. Clients display text from their own catalogue keyed by code." }
            details: { type: array, items: { type: object } }
    Meta:
      type: object
      required: [latency_ms]
      properties:
        latency_ms: { type: integer, minimum: 0 }
    HealthCheck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [status, checks]
          properties:
            status: { type: string, enum: [ok, degraded] }
            checks:
              type: object
              required: [database, object_storage, ollama]
              properties:
                database:
                  allOf:
                    - $ref: "#/components/schemas/HealthCheck"
                    - type: object
                      properties:
                        server_version: { type: string }
                        migration: { type: string }
                        extensions: { type: object, additionalProperties: { type: string } }
                object_storage: { $ref: "#/components/schemas/HealthCheck" }
                ollama:
                  allOf:
                    - $ref: "#/components/schemas/HealthCheck"
                    - type: object
                      properties:
                        reachable: { type: boolean }
                        embed_model: { type: string }
                        embed_model_present: { type: boolean }
    ConsentsRequest:
      type: object
      additionalProperties: false
      required: [consents, policy_version]
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted]
            properties:
              purpose: { type: string, enum: [terms, privacy, cloud_llm_processing, media_processing, marketing] }
              granted: { type: boolean }
        policy_version: { type: string, minLength: 1, maxLength: 40 }
        source: { type: string, enum: [web, telegram, api] }
    ConsentsResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [consents, consent_required]
          properties:
            consents: { type: object, additionalProperties: { $ref: "#/components/schemas/Consent" } }
            consent_required: { type: array, items: { type: string } }
    TraceResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [request_id, executions]
          properties:
            request_id: { type: string }
            executions:
              type: array
              items:
                type: object
                required: [workflow, status, steps]
                properties:
                  workflow: { type: string }
                  status: { type: string }
                  steps: { type: array, items: { type: object } }
    UserSyncRequest:
      type: object
      additionalProperties: false
      required: [external_auth_id]
      properties:
        external_auth_id: { type: string, minLength: 1, maxLength: 255, description: "Subject id from the auth provider (printable ASCII)" }
        email: { type: string, maxLength: 254, format: email }
        display_name: { type: string, maxLength: 100 }
        locale: { type: string, maxLength: 35, description: "BCP-47 tag" }
        jurisdiction_code: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
    Consent:
      type: object
      required: [granted, policy_version, granted_at]
      properties:
        granted: { type: boolean }
        policy_version: { type: string }
        granted_at: { type: string, format: date-time }
    UserSyncResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [user_id, created, role, locale, consents, consent_required]
          properties:
            user_id: { type: string, format: uuid }
            created: { type: boolean }
            role: { type: string, enum: [user, owner, moderator, admin] }
            locale: { type: string }
            jurisdiction_code: { type: [string, "null"] }
            consents:
              type: object
              description: Latest decision per purpose
              additionalProperties: { $ref: "#/components/schemas/Consent" }
            consent_required:
              type: array
              description: Purposes the platform needs before use and that are not granted (terms, privacy)
              items: { type: string, enum: [terms, privacy] }
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    KbIngestRequest:
      type: object
      additionalProperties: false
      required: [jurisdiction]
      properties:
        jurisdiction: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
        include_global: { type: boolean, default: true }
        sources: { type: array, maxItems: 200, items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,79}$" }, description: "Only these source keys (default: all active sources)" }
        force: { type: boolean, default: false, description: "Create a new version and re-chunk even if the text did not change" }
    EvalConfig:
      type: object
      additionalProperties: false
      required: [strategy, model, mode]
      properties:
        strategy: { type: string, enum: [fixed_500_50, structure_aware_v1] }
        model: { type: string, enum: [bge-m3, multilingual-e5-large] }
        mode: { type: string, enum: [dense, lexical, hybrid] }
        candidates: { type: integer, minimum: 1, maximum: 500, default: 50 }
        rrf_k: { type: integer, minimum: 1, maximum: 500, default: 60 }
    EvalRunRequest:
      type: object
      additionalProperties: false
      required: [dataset, jurisdiction]
      properties:
        dataset: { type: string, pattern: "^[a-z0-9_]{3,60}$" }
        version: { type: integer, minimum: 1, default: 1 }
        jurisdiction: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
        k: { type: integer, minimum: 1, maximum: 50, default: 10 }
        configs: { type: array, minItems: 1, maxItems: 48, items: { $ref: "#/components/schemas/EvalConfig" } }
        git_sha: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 80 }
    ListingCreateRequest:
      type: object
      additionalProperties: false
      required: [text, jurisdiction_code]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        jurisdiction_code: { type: string, pattern: "^[A-Za-z]{2}$" }
        kind: { type: string, enum: [room, shared_flat, roommate_wanted] }
        title: { type: string, maxLength: 120 }
    ListingCreatedResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [listing_id, status, next]
          properties:
            listing_id: { type: string, format: uuid }
            status: { type: string, enum: [draft] }
            next:
              type: object
              properties: { upload: { type: string }, analyze: { type: string } }
    ListingChange:
      type: object
      description: "One changed field; rent and deposit in main units with their currency."
      required: [field]
      properties:
        field: { type: string }
        before: {}
        after: {}
        currency: { type: string }
    ListingChangeResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [listing_id, status, diff]
          properties:
            listing_id: { type: string, format: uuid }
            status: { type: string }
            diff: { type: array, items: { $ref: "#/components/schemas/ListingChange" } }
            publication:
              type: [object, "null"]
              description: Automatic publication tried after the change (listing.auto_publish on, draft listings)
              properties:
                published: { type: boolean }
                reason: { type: [string, "null"] }
                missing: { type: array, items: { type: string } }
            photos_deleted_from_storage: { type: integer }
            embedded: { type: [boolean, "null"], description: "Embedded again (place changed or just published); null when not needed" }
    ListingResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [listing_id, status, jurisdiction_code, media, uploads]
          properties:
            listing_id: { type: string, format: uuid }
            status: { type: string }
            jurisdiction_code: { type: string }
            rent_minor: { type: [integer, "null"] }
            currency: { type: [string, "null"] }
            rent_period: { type: [string, "null"], enum: [month, week, null] }
            rent_scope: { type: [string, "null"], enum: [per_room, per_person, whole_flat, unknown, null] }
            extraction:
              type: object
              description: Result of the last extraction (P3) - model answer, issue codes, field confidence, exact address; `publication` when the automatic publication ran (D-083)
            media:
              type: array
              items:
                type: object
                required: [media_id, kind, moderation, analysis]
                properties:
                  media_id: { type: string, format: uuid }
                  kind: { type: string }
                  moderation: { type: string, enum: [pending, ok, blurred, rejected] }
                  analysis:
                    type: object
                    description: |
                      The Media service report (source size, EXIF summary without GPS, capture metrics, blur counts, near duplicates)
                      and, for photos, `vision`: the P7 analysis (D-081). `vision.status` is analyzed or failed; when analyzed,
                      `fields` (room_type, beds, bed_kinds, furniture, appliances, bathroom_fixtures, windows, natural_light,
                      condition, condition_signs, furnished, readable_text, people_visible; a value may be "not_visible"),
                      `flags` (person_in_photo, text_readable_after_blur, not_a_room, condition_to_check), `issues`,
                      `field_confidence` and the prompt version. Free text that names a person is never stored.
            uploads:
              type: array
              items:
                type: object
                required: [upload_id, kind, status]
                properties:
                  upload_id: { type: string, format: uuid }
                  kind: { type: string }
                  status: { type: string, enum: [pending, processing, rejected, expired] }
                  error_code: { type: [string, "null"] }
    PresignRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [kind, content_type, bytes]
            properties:
              kind: { type: string, enum: [photo, audio, video, pdf] }
              content_type: { type: string, maxLength: 100 }
              bytes: { type: integer, minimum: 1, maximum: 104857600 }
    PresignResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [uploads, next]
          properties:
            next: { type: object }
            uploads:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [upload_id, kind, content_type, method, url, headers, expires_at]
                properties:
                  upload_id: { type: string, format: uuid }
                  kind: { type: string }
                  content_type: { type: string }
                  method: { type: string, enum: [PUT] }
                  url: { type: string }
                  headers: { type: object }
                  expires_at: { type: string }
    JobAcceptedResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [job_id, type, status, status_url]
          properties:
            job_id: { type: string, format: uuid }
            type: { type: string, enum: [kb_ingest, eval_retrieval, eval_prompts, listings_embed, fx_refresh, listing_analyze] }
            status: { $ref: "#/components/schemas/JobStatus" }
            status_url: { type: string, pattern: "^/v1/jobs/[0-9a-f-]{36}$" }
    JobResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          additionalProperties: false
          required: [job_id, type, status, attempts, created_at, started_at, finished_at, output, error]
          properties:
            job_id: { type: string, format: uuid }
            type: { type: string }
            status: { $ref: "#/components/schemas/JobStatus" }
            attempts: { type: integer, minimum: 0 }
            created_at: { type: string, format: date-time }
            started_at: { type: [string, "null"], format: date-time }
            finished_at: { type: [string, "null"], format: date-time }
            output: { type: [object, "null"], description: "Job-type specific result (kb_ingest: counts and per-source outcomes; eval_retrieval: runs and summaries)" }
            error: { type: [string, "null"], description: "Short machine-oriented reason when the job failed" }
    EvalRunResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, meta]
      properties:
        request_id: { type: string, format: uuid }
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: object
          required: [run_id, dataset, status, config, summary, queries]
          properties:
            run_id: { type: string, format: uuid }
            dataset: { type: string }
            status: { type: string, enum: [running, succeeded, failed] }
            config: { type: object }
            git_sha: { type: [string, "null"] }
            job_id: { type: [string, "null"], format: uuid }
            started_at: { type: string, format: date-time }
            finished_at: { type: [string, "null"], format: date-time }
            summary: { type: [object, "null"] }
            queries:
              type: array
              items:
                type: object
                required: [query_id, metrics]
                properties:
                  query_id: { type: string }
                  language: { type: [string, "null"] }
                  tags: { type: array, items: { type: string } }
                  metrics: { type: object }
    EmptyRequest:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 5000, description: "listings/embed only" }
    PromptEvalRunRequest:
      type: object
      additionalProperties: false
      required: [prompt, versions]
      properties:
        prompt: { type: string, enum: [P1_router, P2_profile_extractor, P3_listing_extractor, P7_photo_analyzer] }
        versions: { type: array, minItems: 1, maxItems: 5, items: { type: integer, minimum: 1 } }
        models: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: "Default: setting llm.default_model" }
        dataset: { type: string, description: "Default: the prompt's golden set (p1_router, p2_profile, p3_listing, p7_photos)" }
        dataset_version: { type: integer, minimum: 1, default: 1 }
        item_ids: { type: array, items: { type: string } }
        limit: { type: integer, minimum: 1, maximum: 1000 }
        git_sha: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 80 }
    Money:
      type: object
      required: [amount_minor, currency, period, monthly_minor, exponent]
      properties:
        amount_minor: { type: [integer, "null"] }
        currency: { type: [string, "null"] }
        period: { type: string, enum: [month, week] }
        monthly_minor: { type: [integer, "null"], description: "weekly x 52 / 12, rounded down" }
        exponent: { type: [integer, "null"], description: "minor units per major unit = 10^exponent" }
    LatLng:
