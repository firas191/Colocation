  /v2/listings/{id}/submit:
    post:
      operationId: submitListingV2
      summary: The owner asks to publish a draft; the trust check runs as a job (platform P12, D-112; terms and privacy consent)
      description: |
        The checks of POST /v1/listings/{id}/submit (which does not change) with the same 404, 409 and 422 answers.
        When the trust check is needed (trust.enabled on), it does not run inside the request: the answer is 202
        with a listing_trust job to follow with GET /v1/jobs/{id}. Asking again while that check is queued or running
        answers 202 with the same job. With trust.enabled off, or for a listing already published, the answer is 200
        as in v1. The job's output when it succeeded: listing_id; outcome, one of published (data as in the v1 200
        answer, in listing), in_review (the listing waits for a moderator) or rejected, with signals (the codes that
        took points), or not_submitted when the listing changed meanwhile and no longer passes the checks (error has
        code and details as v1 would answer). A check that could not be stored is retried once; then the job fails
        with error trust_check_failed and the listing stays a draft.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Published without a trust check (trust.enabled off) or already published
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingSubmitResponse" }
        "202":
          description: The trust check runs as a job
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingSubmitAcceptedResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v2/search:
    get:
      operationId: searchV2
      summary: Search with more filters, a map area, pages and cover photos (platform P2; terms and privacy consent)
      description: |
        The parameters and rules of GET /v1/search (which does not change), plus: kind, furnished, bills_included,
        available_by (listings free on or before that date; an unknown date does not match), amenities (all of them;
        the vocabulary of listing changes), house_rules (each name:yes|no), bbox (the visible map area), ids (cards of
        these listings in this order, e.g. the assistant's results) and cursor (the meta.next_cursor of the previous
        page; refused with other parameters). With q, the meaning ranking and the word ranking each take the best
        search.v2_candidates listings, fused by reciprocal rank as in v1; pages are cut from that list. Each result has
        cover_photo (a signed URL of the first processed photo, valid media.photo_url_ttl_s seconds, or null),
        photo_count and is_favourite. Never the exact location. Warnings add photos_unavailable (Media service down:
        results without photos).
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - { name: q, in: query, schema: { type: string, maxLength: 300 } }
        - { name: jurisdiction, in: query, schema: { type: string } }
        - { name: max_rent, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: currency, in: query, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: period, in: query, schema: { type: string, enum: [month, week] } }
        - { name: lat, in: query, schema: { type: string } }
        - { name: lng, in: query, schema: { type: string } }
        - { name: near, in: query, schema: { type: string, maxLength: 120 } }
        - { name: radius_m, in: query, schema: { type: string } }
        - { name: use_profile, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: kind, in: query, schema: { type: string, enum: [room, shared_flat, roommate_wanted] } }
        - { name: furnished, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: bills_included, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: available_by, in: query, schema: { type: string, format: date } }
        - { name: amenities, in: query, schema: { type: string }, description: "Comma separated, at most 10: wifi, washing_machine, air_conditioning, heating, parking, balcony, terrace, garden, elevator, dishwasher, equipped_kitchen, private_bathroom, desk, fridge, oven, microwave, tv, pool, gym, security, concierge" }
        - { name: house_rules, in: query, schema: { type: string }, description: "Comma separated name:yes|no, names smoking, pets, guests, parties" }
        - { name: bbox, in: query, schema: { type: string }, description: "min_lng,min_lat,max_lng,max_lat; at most 90 degrees each way (more: 422 too_large with max_degrees)" }
        - { name: ids, in: query, schema: { type: string }, description: "Comma separated listing ids, at most 50" }
        - { name: limit, in: query, schema: { type: string }, description: "1 to 50, default 20" }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchV2Response" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
  /v1/listings/{id}/public:
    get:
      operationId: getPublicListing
      summary: Public view of a listing with its photos as signed URLs (platform P2; terms and privacy consent)
      description: |
        A published listing, or the caller's own listing in any state (a preview; is_own true). Anything else is 404,
        whether it exists or not. Public fields only: the fuzzed public point, never the exact location or the
        owner's identity. Photos are the processed copies (EXIF removed, faces and text blurred), as signed GET URLs
        through the proxy, valid media.photo_url_ttl_s seconds. GET /v1/listings/{id} stays the owner view.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
