  /v1/listings/{id}/submit:
    post:
      operationId: submitListing
      summary: The owner asks to publish a draft (platform P3, D-102; terms and privacy consent)
      description: |
        Checks what the draft still needs: a rent, a place found on the map, at least one photo that was not
        rejected. Missing ones: 422 with details [{field: rent | place | photos, issue: required | place_not_found}].
        An analysis job still queued or running: 409 with details [{field: analysis, issue: running, job_id}]. A
        listing that is not a draft: 409 with details [{field: status, issue: status_not_allowed, current}]; an
        archived listing is published again with PATCH /v1/listings/{id} {status: published}. Submitting a published
        listing again answers 200 with the same data and changes nothing. Then the trust check runs (platform P8,
        D-107: database checks, the packs' phrase rules and the Trust agent; the score and the verdict are computed
        in code). ok: the listing is published with checked true, embedded for the search by meaning, and the owner
        gets the notification listing_published. review: 409 with details [{field: trust, issue: in_review,
        signals}], the listing waits for a moderator (status pending_review, notification listing_in_review).
        block: 409 with details [{field: trust, issue: rejected, signals}], status rejected (notification
        listing_rejected). A check that could not be stored: 409 [{field: trust, issue: missing}]. With the setting
        trust.enabled off the listing is published without the check (checked false). Another owner's listing: 404.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
        - $ref: "#/components/parameters/XTimestamp"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XSignature"
        - $ref: "#/components/parameters/XUserIdRequired"
        - $ref: "#/components/parameters/XClientIp"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XIdempotencyKey"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Published
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingSubmitResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
