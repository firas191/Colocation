              items: { type: object, required: [code], properties: { code: { type: string, enum: [email_confirmed, telegram_linked, photos_checked] } } }
            jurisdictions:
              type: array
              items:
                type: object
                required: [code, name, currency, exponent]
                properties:
                  code: { type: string }
                  name: { type: string }
                  currency: { type: string }
