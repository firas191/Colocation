        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      operationId: deleteMe
      summary: Delete the caller's account (platform P10, D-109; backend spec 13.6; no consent needed)
      description: |
        Query confirm=DELETE. The account's personal data is erased (app.erase_user and the platform's erasure triggers):
        name, e-mail, sign-in and Telegram ids, profiles, saved searches, drafts, documents the person made (their files are
        queued for deletion and removed by wf.ops.retention), household memberships set to left. Shared records stay without
        the name (expenses, so balances still add up). The website then removes its sign-in.
