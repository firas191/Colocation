      description: |
        number is the listing's number for the owner assistant ("annonce 2"), the same as the assistant uses (newest
        first, rejected ones left out, first 10). readiness (drafts only): missing as in POST .../submit, and issues,
        the analysis issues that still apply after the owner's corrections. actions says which buttons apply: edit (any
        listing but a rejected one; PATCH), analyze (draft), submit (draft, ready, no analysis running), archive, republish (archived after being
        published; PATCH status), view (published). cover_photo is a signed URL of the first photo, null with the
        warning photos_unavailable when the Media service does not answer. Pages: meta.next_cursor as cursor.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
