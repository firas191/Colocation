        request_id: { type: string, format: uuid }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              required: [next_cursor]
              properties:
                next_cursor: { type: [string, "null"] }
        data:
          type: object
          additionalProperties: false
          required: [items, counts, warnings]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [listing_id, status, number, kind, title, display_title, jurisdiction_code, rent, rent_scope, city,
                           neighbourhood, created_at, updated_at, published_at, analysis, readiness, photo_count,
                           cover_photo, actions]
                not: { required: [location] }
                properties:
                  listing_id: { type: string, format: uuid }
                  status: { type: string, enum: [draft, processing, pending_review, published, rejected, archived] }
                  number: { type: [integer, "null"], minimum: 1, maximum: 10 }
                  kind: { type: string, enum: [room, shared_flat, roommate_wanted] }
                  title: { type: [string, "null"] }
                  display_title: { type: [string, "null"] }
                  jurisdiction_code: { type: string }
                  rent: { $ref: "#/components/schemas/Money" }
                  rent_scope: { type: [string, "null"], enum: [per_room, per_person, whole_flat, unknown, null] }
                  city: { type: [string, "null"] }
                  neighbourhood: { type: [string, "null"] }
                  created_at: { type: string }
                  updated_at: { type: string }
                  published_at: { type: [string, "null"] }
                  analysis:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [job_id, status, created_at, finished_at]
                        properties:
                          job_id: { type: string, format: uuid }
                          status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
                          created_at: { type: string }
                          finished_at: { type: [string, "null"] }
                  readiness: { oneOf: [{ $ref: "#/components/schemas/ListingReadiness" }, { type: "null" }] }
                  photo_count: { type: integer, minimum: 0 }
                  cover_photo: { oneOf: [{ $ref: "#/components/schemas/PhotoUrl" }, { type: "null" }] }
                  actions:
                    type: object
                    additionalProperties: false
                    required: [edit, analyze, submit, archive, republish, view]
                    properties:
                      edit: { type: boolean }
                      analyze: { type: boolean }
                      submit: { type: boolean }
                      archive: { type: boolean }
                      republish: { type: boolean }
                      view: { type: boolean }
            counts:
              type: object
              required: [all, draft, published, archived]
              properties:
                all: { type: integer }
                draft: { type: integer }
                published: { type: integer }
                archived: { type: integer }
            warnings: { type: array, items: { type: string, enum: [photos_unavailable] } }
    UserRef:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
    Conversation:
      type: object
      required: [conversation_id, kind, listing, other, blocked, unread, last_message, created_at, last_message_at]
      properties:
        conversation_id: { type: string, format: uuid }
        kind: { type: string, enum: [listing, application, household, direct] }
        listing: { type: [object, "null"] }
        other: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        blocked: { type: boolean }
        unread: { type: integer, minimum: 0 }
        last_message: { type: [object, "null"] }
        created_at: { type: string }
        last_message_at: { type: string }
    Message:
      type: object
      required: [id, mine, body, created_at]
      properties:
        id: { type: integer }
