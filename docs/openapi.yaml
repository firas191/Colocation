            consents: { type: object, additionalProperties: { $ref: "#/components/schemas/Consent" } }
            consent_required: { type: array, items: { type: string, enum: [terms, privacy] } }
            flags:
              type: object
              required: [has_profile, has_listings, is_staff, telegram_linked]
              properties:
                has_profile: { type: boolean }
                has_listings: { type: boolean, description: "Owns a listing that is not rejected (the 'owner' side of the account)" }
                is_staff: { type: boolean, description: "role moderator or admin" }
                telegram_linked: { type: boolean }
