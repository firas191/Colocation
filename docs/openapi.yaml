    get:
      operationId: getMe
      summary: The calling user, consents, flags and counts (platform P1, D-096; no consent needed)
      description: |
        Read through the row-level layer of migration 0022: counts and flags only ever cover the caller's own rows.
        consent_required lists the purposes the platform needs before use (terms, privacy). jurisdictions lists the
        countries with their currency exponent, which clients need to show and enter amounts (Money.exponent).
        No query parameters.
      parameters:
        - $ref: "#/components/parameters/XKeyId"
