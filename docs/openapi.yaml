      summary: Analyze the listing text and the uploaded files (owner; consents terms, privacy, media_processing; asynchronous)
      description: |
        Creates a job of type listing_analyze (worker wf.listing.analyze). Photos: type and size checks, EXIF read
        then stripped (GPS never stored), faces, text and screens blurred, SHA-256 and perceptual hash, near-duplicate
        lookup. Raw uploads are deleted once processed or rejected. Then the text extraction (P3, wf.listing.extract):
        kind, rent with currency, period and scope, deposit, bills, date, bedrooms, furnished, amenities, house rules,
        place words; a rent outside the plausible range for its currency is not stored (issue rent_out_of_range).
        The fields and the issues appear in GET /v1/listings/{id}. Accepted when the listing has text or files
        waiting. Transient failures are retried with backoff.
