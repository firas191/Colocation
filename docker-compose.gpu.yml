# Adds the NVIDIA GPU to Ollama. Use only if "docker run --rm --gpus all ubuntu:24.04 nvidia-smi"
# works on this machine (scripts/windows/env-check.ps1 runs that test).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
